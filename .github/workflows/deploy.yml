name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install
        
      - name: Build project
        run: npm run build
        
      - name: Prepare static site for GitHub Pages
        run: |
          mkdir -p static_site
          # Buscar dónde ha dejado TanStack Start los archivos finales y copiarlos
          if [ -d ".output/public" ]; then cp -r .output/public/* static_site/; fi
          if [ -d "dist/client" ]; then cp -r dist/client/* static_site/; fi
          if [ -d "dist" ] && [ ! -d "dist/client" ]; then cp -r dist/* static_site/; fi
          # Crear archivo crítico para que GitHub no bloquee los assets de TanStack
          touch static_site/.nojekyll
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./static_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
