<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo circular principal -->
  <circle cx="50" cy="50" r="48" fill="#0b0f19"/>
  
  <!-- Estructura del sable central simplificada para validación segura -->
  <rect x="48" y="12" width="4" height="76" rx="2" fill="#10b981"/>
  
  <!-- Capa 1: Hexágono Exterior Blanco (Comunidad) -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Capa 2: Hexágono Intermedio Verde (Contenido) -->
  <polygon points="50,28 69,39 69,61 50,72 31,61 31,39" fill="none" stroke="#10b981" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Capa 3: Hexágono Central Sólido (Mentoría) -->
  <polygon points="50,38 60,44 60,56 50,62 40,56 40,44" fill="#10b981"/>
  
  <!-- Núcleo de contraste -->
  <circle cx="50" cy="50" r="6" fill="#0b0f19" stroke="#ffffff" stroke-width="2"/>
</svg>
